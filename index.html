:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#eef1f5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef1f5}body{min-height:100dvh}button,input,select{font:inherit}button{touch-action:manipulation}
.app{width:min(100%,540px);margin:auto;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}.brandbar{margin:calc(-18px - env(safe-area-inset-top)) -16px 16px;background:#1b365d;padding:calc(9px + env(safe-area-inset-top)) 16px 9px;display:flex;justify-content:center;align-items:center}.brandbar img{display:block;width:min(270px,72vw);height:auto}
.hidden{display:none!important}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}h1,h2,p{margin:0}h1{font-size:30px;line-height:1.05;letter-spacing:-.03em}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:#667085;margin-bottom:5px}
.card{background:#fff;border:1px solid #dce1e8;border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 4px 16px rgba(17,24,39,.05)}
.badge{background:#111827;color:#fff;border-radius:999px;padding:8px 11px;font-size:13px;font-weight:800}.label{display:block;font-size:13px;font-weight:800;color:#475467;margin-bottom:8px}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.segment button{min-height:48px;border:1px solid #cfd6df;background:#f7f8fa;border-radius:12px;font-weight:800}.segment button.on{background:#111827;color:#fff;border-color:#111827}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label span{display:block;color:#475467;font-size:13px;font-weight:700;margin-bottom:6px}
input,select{width:100%;min-height:48px;border:1px solid #cfd6df;border-radius:12px;background:#fff;color:#111827;padding:0 12px;font-size:18px;font-weight:700}
.defaults{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{font-size:13px;color:#667085;margin-top:4px}
.primary,.secondary,.plain{border-radius:14px;font-weight:800}.primary{border:1px solid #bfd4ef;background:#edf5ff;color:#1d4f86}.secondary{background:#f7f9fc;color:#344054;border:1px solid #cfd6df}.plain{border:1px solid #d7dde5;background:#f7f9fc;color:#475467}.danger{color:#9b2c2c}
.big{width:100%;min-height:58px;font-size:18px}.actions{display:grid;gap:10px;margin-top:12px}.actions .secondary{min-height:48px}
.statusdock{position:sticky;top:calc(env(safe-area-inset-top) + 4px);z-index:20;background:rgba(238,241,245,.94);backdrop-filter:blur(10px);padding:4px 0 6px;margin-bottom:6px}.currentwrap{margin:0 0 6px}.currentcard{width:100%;text-align:center;background:#eef8f2;border:1px solid #c9dfd0;border-radius:14px;padding:14px 18px;box-shadow:0 3px 12px rgba(17,24,39,.04)}.currenttitle{font-size:33px;font-weight:900;line-height:1.05;letter-spacing:-.025em;color:#163e2d}.lastfloat{min-height:40px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #d6dce4;border-radius:12px;padding:8px 11px;font-size:13px;font-weight:800;color:#667085;box-shadow:0 2px 8px rgba(17,24,39,.04)}.workdefaults{background:#fff;border:1px solid #dce1e8;border-radius:12px;margin:8px 0 0;overflow:hidden}.workdefaults summary{cursor:pointer;list-style:none;min-height:42px;padding:11px 13px;font-weight:800}.workdefaults summary::-webkit-details-marker{display:none}.workdefaults[open] summary{border-bottom:1px solid #e3e7ed}.workdefaultsbody{padding:11px 13px 13px}
.fields{display:grid;gap:8px;margin-bottom:10px}.fields.bulk{grid-template-columns:repeat(4,1fr)}.fields.rsp{grid-template-columns:repeat(2,1fr)}
.field{position:relative;border:2px solid #d6dce4;background:#fff;border-radius:15px;padding:11px 4px;text-align:center;min-width:0}.field.on{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}.field.locked{background:#f3f4f6;border-color:#667085}.field small{display:block;font-size:11px;font-weight:800;color:#667085;text-transform:uppercase}.field strong{display:block;font-size:31px;margin-top:3px}.field.empty strong{color:#b3bbc6}.field .lock{position:absolute;right:5px;top:5px;width:25px;height:25px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#eef1f5;color:#667085;font-size:12px;line-height:1}.field.locked .lock{background:#111827;color:#fff}
.padtop{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:2px 0 6px}.padtop .undo{grid-column:1;min-height:34px;padding:3px 8px;font-size:12px}.padtop .erase{grid-column:3;min-height:34px;padding:3px 8px;font-size:12px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.pad button{min-height:68px;border:1px solid #c8d0db;background:#fff;border-radius:16px;font-size:28px;font-weight:900}.pad button:active{transform:scale(.97);background:#e8ebef}
.mainactions{display:grid;gap:8px;margin-top:6px}.mainactions button{width:100%;min-height:56px}.confirm{font-size:18px}.confirm:disabled{opacity:.38}.sameprev{min-height:52px}.settingsrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.settingsrow button{min-height:42px;padding:5px 8px;font-size:13px}.pairtoggle.off{background:#fff3f0;border-color:#efc6bd;color:#9a3412}.rowtools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.rowtools button{min-height:46px;padding:6px;font-size:13px}.sectionbtn{width:100%;min-height:48px;margin-top:16px}
.nav{display:flex;justify-content:space-between;margin-top:6px}.recent{margin-top:14px;padding-top:13px;border-top:1px solid #d4dae2}.recentlist{display:grid;gap:7px;margin-top:8px}.recentitem{width:100%;border:1px solid #d6dce4;border-radius:12px;background:#fff;min-height:48px;padding:8px 11px;display:flex;align-items:center;justify-content:space-between;text-align:left}.recentitem.latest{border-color:#111827;background:#f3f4f6;box-shadow:0 0 0 2px rgba(17,24,39,.06)}.recentitem span{font-weight:800;letter-spacing:.08em;color:#667085}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:11px 14px;border-radius:999px;font-size:14px;font-weight:800;white-space:nowrap;max-width:calc(100vw - 32px)}
</style>

function empty(){return{Bend:'',Reach:'',Step:'',Ladder:''}}
function fresh(){return{config:{area:'Bulk',aisle:'',row:1,defaults:{Bulk:empty(),RSP:empty()},frozen:{Bulk:empty(),RSP:empty()},pairedRows:true},records:[],undoStack:[]}}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(!x||!x.config||!Array.isArray(x.records))return fresh();x.config.area=x.config.area==='RSP'?'RSP':'Bulk';x.config.aisle=String(x.config.aisle||'').toUpperCase();x.config.row=norm(x.config.row);x.config.defaults=x.config.defaults||{};x.config.defaults.Bulk=Object.assign(empty(),x.config.defaults.Bulk||{});x.config.defaults.RSP=Object.assign(empty(),x.config.defaults.RSP||{});x.config.frozen=x.config.frozen||{};x.config.frozen.Bulk=Object.assign(empty(),x.config.frozen.Bulk||{});x.config.frozen.RSP=Object.assign(empty(),x.config.frozen.RSP||{});if(typeof x.config.pairedRows!=='boolean')x.config.pairedRows=true;if(!Array.isArray(x.undoStack))x.undoStack=x.lastUndo?[x.lastUndo]:[];return x}catch(e){return fresh()}}
var state=load(),draft=empty(),active=0,timer;
function q(id){return document.getElementById(id)}function norm(v){var n=parseInt(v,10);return isFinite(n)&&n>0?n:1}function digit(v){return /^[1-9]$/.test(String(v))}
function fields(){return SETS[state.config.area]}function key(a,i,r){return a+'|'+String(i).toUpperCase()+'|'+norm(r)}function rowText(r){return String(norm(r)).padStart(2,'0')}
function save(){localStorage.setItem(KEY,JSON.stringify(state));counts()}
function defaultsDraft(){var d=empty(),src=state.config.defaults[state.config.area]||empty(),fr=state.config.frozen[state.config.area]||empty();fields().forEach(function(f){d[f]=digit(fr[f])?fr[f]:(digit(src[f])?src[f]:'')});return d}
function current(){var k=key(state.config.area,state.config.aisle,state.config.row);return state.records.find(function(r){return key(r.area,r.aisle,r.row)===k})||null}function copyRec(r){return r?{area:r.area,aisle:r.aisle,row:norm(r.row),values:Object.assign(empty(),r.values||{}),skipped:!!r.skipped,updatedAt:r.updatedAt}:null}function setUndo(k,before,rec){state.undoStack=state.undoStack||[];state.undoStack.push({recordKey:k,before:copyRec(before),area:rec.area,aisle:rec.aisle,row:norm(rec.row)})}function rowStep(){return state.config.pairedRows?1:2}
function frozen(f){return digit((state.config.frozen[state.config.area]||empty())[f])}function best(){var fs=fields(),i=fs.findIndex(function(f){return !frozen(f)&&!digit(draft[f])});if(i>=0)return i;i=fs.findIndex(function(f){return !frozen(f)});return i>=0?i:0}
function loadDraft(){var r=current();draft=r?Object.assign(empty(),r.values):defaultsDraft();active=best();renderSurvey()}function recordCode(r){if(!r)return'—';if(r.skipped)return'NO SHELF';var fs=SETS[r.area]||SETS.Bulk;return fs.map(function(f){return r.values&&r.values[f]||''}).join('')||'—'}function lastCodeText(r){if(!r)return'—';if(r.skipped)return'NO SHELF';var v=r.values||empty();return r.area==='RSP'?('B'+(v.Bend||'–')+' R'+(v.Reach||'–')):('B'+(v.Bend||'–')+' R'+(v.Reach||'–')+' S'+(v.Step||'–')+' L'+(v.Ladder||'–'))}function lastSaved(){if(!state.records.length)return null;return state.records.slice().sort(function(a,b){return String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))})[0]}
function counts(){var s=state.records.length+' saved';q('count').textContent=s;q('setupCount').textContent=s}
function renderDefaults(id){var box=q(id);if(!box)return;box.innerHTML='';fields().forEach(function(f){var lab=document.createElement('label'),sp=document.createElement('span'),sel=document.createElement('select');sp.textContent=f;sel.dataset.field=f;var o=document.createElement('option');o.value='';o.textContent='No default';sel.appendChild(o);for(var i=1;i<=9;i++){o=document.createElement('option');o.value=String(i);o.textContent=String(i);sel.appendChild(o)}sel.value=state.config.defaults[state.config.area][f]||'';sel.onchange=function(){state.config.defaults[state.config.area][f]=sel.value;save();toast(f+' default '+(sel.value||'cleared'))};lab.appendChild(sp);lab.appendChild(sel);box.appendChild(lab)})}
function renderSetup(){
 document.querySelectorAll('.area').forEach(function(b){b.classList.toggle('on',b.dataset.area===state.config.area)});
 q('aisle').value=state.config.aisle;q('row').value=state.config.row;renderDefaults('defaults');counts()
}
function layoutActions(){var main=q('mainActions'),tools=q('rowtools'),confirm=q('confirm'),same=q('samePrev'),skip=q('skipRow'),next=q('nextAisle'),jump=q('jumpRow');if(state.config.area==='Bulk'){same.classList.remove('hidden');main.appendChild(confirm);main.appendChild(skip);main.appendChild(next);tools.appendChild(same);tools.appendChild(jump)}else{same.classList.add('hidden');main.appendChild(next);main.appendChild(confirm);tools.appendChild(skip);tools.appendChild(jump)}}
function renderSurvey(){
 q('currentTitle').textContent=state.config.aisle+' ROW '+rowText(state.config.row);var last=lastSaved();q('lastLine').textContent=last?('LAST · '+last.aisle+' ROW '+rowText(last.row)):'LAST · —';q('pairedRows').textContent='Paired Rows: '+(state.config.pairedRows?'ON':'OFF');q('pairedRows').classList.toggle('off',!state.config.pairedRows);layoutActions();renderDefaults('workDefaults');
 var fs=fields();q('fields').className='fields '+state.config.area.toLowerCase();q('fields').innerHTML='';
 fs.forEach(function(f,i){var b=document.createElement('button'),locked=frozen(f);b.className='field'+(i===active?' on':'')+(digit(draft[f])?'':' empty')+(locked?' locked':'');b.innerHTML='<span class="lock" data-lock="1" aria-label="'+(locked?'Unfreeze ':'Freeze ')+f+'">'+(locked?'🔒':'🔓')+'</span><small>'+f+'</small><strong>'+(draft[f]||'–')+'</strong>';b.onclick=function(e){if(e.target&&e.target.dataset&&e.target.dataset.lock){e.stopPropagation();toggleFreeze(f,i);return}active=i;renderSurvey()};q('fields').appendChild(b)});
 q('confirm').disabled=!fs.every(function(f){return digit(draft[f])});recent();counts()
}
function toggleFreeze(f,i){var fr=state.config.frozen[state.config.area];if(frozen(f)){fr[f]='';save();active=i;toast(f+' unfrozen')}else{if(!digit(draft[f])){active=i;renderSurvey();toast('Set '+f+' first');return}fr[f]=draft[f];save();active=best();toast(f+' frozen at '+draft[f])}renderSurvey()}function enter(v){var fs=fields(),f=fs[active],next=-1;draft[f]=v;if(frozen(f))state.config.frozen[state.config.area][f]=v;save();for(var i=active+1;i<fs.length;i++){if(!frozen(fs[i])){next=i;break}}if(next>=0){active=next;renderSurvey();return}if(fs.every(function(x){return digit(draft[x])})){saveNext();return}renderSurvey()}
function erase(){var fs=fields(),f=fs[active];if(draft[f])draft[f]='';else if(active>0){active--;draft[fs[active]]=''}renderSurvey()}
function saveNext(){var fs=fields();if(!fs.every(function(f){return digit(draft[f])}))return;var vals=empty();fs.forEach(function(f){vals[f]=draft[f]});
 var rec={area:state.config.area,aisle:state.config.aisle,row:norm(state.config.row),values:vals,skipped:false,updatedAt:new Date().toISOString()},k=key(rec.area,rec.aisle,rec.row),idx=state.records.findIndex(function(r){return key(r.area,r.aisle,r.row)===k}),before=idx>=0?copyRec(state.records[idx]):null;setUndo(k,before,rec);
 if(idx>=0)state.records[idx]=rec;else state.records.push(rec);state.config.row=norm(state.config.row)+rowStep();save();draft=defaultsDraft();active=best();renderSurvey();toast(idx>=0?'Row updated':'Saved')
}
function samePrevious(){var row=norm(state.config.row),a=state.records.filter(function(r){return !r.skipped&&r.area===state.config.area&&String(r.aisle).toUpperCase()===state.config.aisle&&norm(r.row)<row}).sort(function(x,y){return norm(y.row)-norm(x.row)});if(!a.length){toast('No previous row in this section');return}var prev=a[0],fs=fields(),fr=state.config.frozen[state.config.area]||empty();fs.forEach(function(f){draft[f]=digit(fr[f])?fr[f]:(prev.values&&digit(prev.values[f])?prev.values[f]:'')});active=best();renderSurvey();toast('Copied Row '+rowText(prev.row))}
function skipRow(){var rec={area:state.config.area,aisle:state.config.aisle,row:norm(state.config.row),values:empty(),skipped:true,updatedAt:new Date().toISOString()},k=key(rec.area,rec.aisle,rec.row),idx=state.records.findIndex(function(r){return key(r.area,r.aisle,r.row)===k}),before=idx>=0?copyRec(state.records[idx]):null;setUndo(k,before,rec);if(idx>=0)state.records[idx]=rec;else state.records.push(rec);state.config.row=norm(state.config.row)+rowStep();save();draft=defaultsDraft();active=best();renderSurvey();toast('Row marked No Shelf')}
function jumpRow(){var v=prompt('Jump to row:',String(state.config.row));if(v===null)return;var n=parseInt(v,10);if(!isFinite(n)||n<1){toast('Enter a valid row');return}state.config.row=n;save();loadDraft();window.scrollTo(0,0);toast('Jumped to Row '+rowText(n))}function nextAisle(){var s=String(state.config.aisle||'').toUpperCase(),m=s.match(/^(.*?)(\d+)$/);if(!m){toast('Aisle cannot be auto-incremented');return}var width=m[2].length,n=String(parseInt(m[2],10)+1).padStart(width,'0');state.config.aisle=m[1]+n;state.config.row=1;save();loadDraft();window.scrollTo(0,0);toast('Now '+state.config.aisle+' · Row 01')}
function undoLast(){state.undoStack=state.undoStack||[];var u=state.undoStack.pop();if(!u){var r=lastSaved();if(!r){toast('Nothing to undo');return}var ri=state.records.findIndex(function(x){return key(x.area,x.aisle,x.row)===key(r.area,r.aisle,r.row)});if(ri>=0)state.records.splice(ri,1);state.config.area=r.area;state.config.aisle=r.aisle;state.config.row=norm(r.row);save();loadDraft();window.scrollTo(0,0);toast('Save undone');return}var idx=state.records.findIndex(function(r){return key(r.area,r.aisle,r.row)===u.recordKey});if(u.before){if(idx>=0)state.records[idx]=copyRec(u.before);else state.records.push(copyRec(u.before))}else if(idx>=0)state.records.splice(idx,1);state.config.area=u.area;state.config.aisle=u.aisle;state.config.row=norm(u.row);save();loadDraft();window.scrollTo(0,0);toast('Save undone')}
function previous(){var n=norm(state.config.row)-rowStep();if(n<1)return;state.config.row=n;save();loadDraft()}
function recent(){var list=q('recentList');list.innerHTML='';var a=state.records.slice().sort(function(x,y){return String(y.updatedAt).localeCompare(String(x.updatedAt))}).slice(0,5);
 if(!a.length){var d=document.createElement('div');d.className='muted';d.textContent='No rows saved yet.';list.appendChild(d);return}
 a.forEach(function(r,ri){var fs=SETS[r.area]||SETS.Bulk,code=r.skipped?'NO SHELF':fs.map(function(f){return r.values&&r.values[f]||''}).join(''),b=document.createElement('button');b.className='recentitem'+(ri===0?' latest':'');b.innerHTML='<strong>'+esc(r.area)+' · '+esc(r.aisle)+' · Row '+rowText(r.row)+'</strong><span>'+esc(code)+'</span>';b.onclick=function(){state.config.area=r.area;state.config.aisle=r.aisle;state.config.row=norm(r.row);save();loadDraft();window.scrollTo(0,0)};list.appendChild(b)})
}
function showSurvey(){var a=q('aisle').value.trim().toUpperCase();if(!a){q('aisle').focus();toast('Enter an aisle');return}state.config.aisle=a;state.config.row=norm(q('row').value);save();q('setup').classList.add('hidden');q('survey').classList.remove('hidden');loadDraft();window.scrollTo(0,0)}
function showSetup(){state.config.frozen={Bulk:empty(),RSP:empty()};state.config.pairedRows=true;save();q('survey').classList.add('hidden');q('setup').classList.remove('hidden');renderSetup();window.scrollTo(0,0)}
function csvEsc(v){var s=String(v==null?'':v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function buildCsv(){var h=['Area','Aisle','Row #','Bend Tier','Reach Tier','Step Tier','Ladder Tier'],a=state.records.filter(function(r){return !r.skipped}).slice().sort(function(x,y){var z=x.area.localeCompare(y.area);if(z)return z;z=x.aisle.localeCompare(y.aisle,undefined,{numeric:true,sensitivity:'base'});return z||norm(x.row)-norm(y.row)});
 var rows=a.map(function(r){return[r.area,r.aisle,norm(r.row),r.values.Bend||'',r.values.Reach||'',r.area==='Bulk'?(r.values.Step||''):'',r.area==='Bulk'?(r.values.Ladder||''):'' ]});return[h].concat(rows).map(function(r){return r.map(csvEsc).join(',')}).join('\n')
}
function exportName(){var a=state.records.filter(function(r){return !r.skipped}).slice().sort(function(x,y){return String(x.aisle).localeCompare(String(y.aisle),undefined,{numeric:true,sensitivity:'base'})});if(!a.length)return'ErgoZone.csv';var first=String(a[0].aisle||'').toUpperCase(),last=String(a[a.length-1].aisle||'').toUpperCase();return'ErgoZone '+first+(last&&last!==first?last:'')+'.csv'}
async function exportCsv(){if(!state.records.some(function(r){return !r.skipped})){toast('No measured rows to export');return}var csv=buildCsv(),name=exportName(),file=new File([csv],name,{type:'text/csv;charset=utf-8'});
 try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({files:[file],title:'Ergonomic Zone Survey CSV'});return}}catch(e){if(e&&e.name==='AbortError')return}
 var u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500);toast('CSV exported')
}
function toast(s){q('toast').textContent=s;q('toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(function(){q('toast').classList.add('hidden')},1400)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
document.querySelectorAll('.area').forEach(function(b){b.onclick=function(){state.config.area=b.dataset.area==='RSP'?'RSP':'Bulk';save();renderSetup()}});
q('aisle').oninput=function(){var p=this.selectionStart;this.value=this.value.toUpperCase();try{this.setSelectionRange(p,p)}catch(e){}};
q('aisle').onchange=function(){state.config.aisle=this.value.trim().toUpperCase();save()};q('row').onchange=function(){state.config.row=norm(this.value);this.value=state.config.row;save()};
q('clearDefaults').onclick=function(){state.config.defaults[state.config.area]=empty();save();renderSetup()};q('start').onclick=showSurvey;q('backSetup').onclick=showSetup;q('erase').onclick=erase;
q('reset').onclick=function(){draft=defaultsDraft();active=best();renderSurvey()};q('pairedRows').onclick=function(){state.config.pairedRows=!state.config.pairedRows;save();renderSurvey();toast('Paired Rows '+(state.config.pairedRows?'ON':'OFF'))};q('confirm').onclick=saveNext;q('samePrev').onclick=samePrevious;q('skipRow').onclick=skipRow;q('jumpRow').onclick=jumpRow;q('nextAisle').onclick=nextAisle;q('undoSave').onclick=undoLast;q('prev').onclick=previous;q('export').onclick=exportCsv;q('exportSetup').onclick=exportCsv;
q('clearAll').onclick=function(){if(!state.records.length&&!state.config.aisle){toast('Already clean');return}if(confirm('Start a new file? This deletes all saved rows and resets aisle/row. Defaults are kept.')){state.records=[];state.config.aisle='';state.config.row=1;state.config.frozen={Bulk:empty(),RSP:empty()};state.config.pairedRows=true;state.undoStack=[];save();renderSetup();toast('New file ready')}};
for(var i=1;i<=9;i++){(function(n){var b=document.createElement('button');b.textContent=String(n);b.onclick=function(){enter(String(n))};q('pad').appendChild(b)})(i)}
renderSetup();if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
})();
</script>
